# Agent profile: GPT-5.5 (requires Max Mode).
#
# To use: cp config/agent/cursor-gpt-5.5.toml config/agent.toml

[agent]
backend = "cursor-cli"
model = "gpt-5.5-high"
max_mode = true
runs_per_stage = 0
poll_seconds = 5
agent_round_tries = 8
retry_base_sleep = 4
retry_continue_prompt = "Transient Cursor API/network disconnect. Continue exactly where you left off; do not restart the whole iteration from scratch."
state_dir = ".artifacts/agent-loop-state"
max_consecutive_review_fails = 3
