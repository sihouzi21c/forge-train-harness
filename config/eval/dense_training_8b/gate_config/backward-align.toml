# backward-align.toml — alignment.backward 单一源(MiniCPM4-8B 4 层 proxy;与 forward-align 逐字段相同)
# 同一单步 DP=1 采集,取 grad 子集逐位对齐。
# grad_accum = GBS/(MBS·DP) = 2/(2·1) = 1。
[shared]
world_size_override        = 1
num_steps_override         = 1
micro_batch_size_override  = 2
global_batch_size_override = 2
num_layers_override        = 4
gate_window                = [0, 1]

[shared.gate]
gate_bitwise       = true
gate_atol          = 0
hash_capture_level = 2
forge_init_ones    = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
