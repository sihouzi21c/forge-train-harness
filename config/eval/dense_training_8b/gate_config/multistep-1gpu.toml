# multistep-1gpu.toml — bitwise-singlecard 单一源(MiniCPM4-8B 4 层 proxy;单卡多步 bitwise,DP=1)
# 8 步单卡逐位轨迹(fwd+bwd+loss+grad),真实 Ultra-FineWeb dataloader;
# grad_accum = GBS/(MBS·DP) = 16/(2·1) = 8。是 dptp(DP×TP)门禁的单卡前置。
[shared]
world_size_override        = 1
num_steps_override         = 8
micro_batch_size_override  = 2
global_batch_size_override = 16
num_layers_override        = 4
gate_window                = [1, 9]

[shared.gate]
gate_bitwise            = true
gate_atol               = 0
hash_capture_level      = 2
mfu_e2e_target          = 0
loss_abs_threshold      = 0
grad_norm_abs_threshold = 0
forge_init_ones         = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
