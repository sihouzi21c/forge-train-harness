# resume-gate-20.toml — resume 单一源(Qwen3 0.6B;两段 checkpoint resume bitwise;25 步 / MBS=3 / GBS=48)
[shared]
world_size_override        = 2
num_steps_override         = 25
micro_batch_size_override  = 3
global_batch_size_override = 48
gate_window                = [10, 25]
resume_save_step           = 10

[shared.gate]
hash_capture_level = 1
forge_init_ones    = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
