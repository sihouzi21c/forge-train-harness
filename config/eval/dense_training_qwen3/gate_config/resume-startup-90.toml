# resume-startup-90.toml — 续训启动时间门禁单一源 (resume milestone, ours-only)
# 从 step 90 续训:dataloader 必须 O(1) cursor-restore seek。形状同本 variant 的
# resume-gate-20(Qwen3 0.6B;GBS48 / MBS3 / DP2 / grad_accum8)。判定阈值
# resume_startup_budget_s 不在此文件 —— 按设计 §5 放注册表 [evals.resume-startup-90]。
[shared]
world_size_override        = 2
num_steps_override         = 100
micro_batch_size_override  = 3
global_batch_size_override = 48
resume_save_step           = 90
resume_post_steps          = 10

[shared.gate]
hash_capture_level = 0
forge_init_ones    = 0

[optim]
lr_warmup_iters_override = 0

[ours]
deterministic = true
