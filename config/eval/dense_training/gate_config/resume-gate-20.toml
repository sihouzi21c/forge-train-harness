# resume-gate-20.toml — resume 单一源(两段 checkpoint resume bitwise)
[shared]
world_size_override        = 2
num_steps_override         = 20
micro_batch_size_override  = 4
global_batch_size_override = 80
gate_window                = [10, 20]
resume_save_step           = 10

[shared.gate]
hash_capture_level = 1
forge_init_ones    = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
