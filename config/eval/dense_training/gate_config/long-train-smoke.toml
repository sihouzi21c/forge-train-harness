# long-train-smoke.toml — long-horizon-smoke(同 long-train,20 步 / window [5,20) / warmup=5)
[shared]
world_size_override        = 2
num_steps_override         = 20
micro_batch_size_override  = 4
global_batch_size_override = 80
gate_window                = [5, 20]

[shared.gate]
loss_rel_threshold = 0.025
warmup_steps       = 5
forge_init_ones    = 1

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = false

[ours]
deterministic              = false
micro_batch_size_override  = 10
cublas_workspace_config          = "@unset"
nvte_allow_nondeterministic_algo = "@unset"
