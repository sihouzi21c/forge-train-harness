# perf-bitwise.toml — bitwise-perf 单一源(bitwise + MFU≥10%)
[shared]
world_size_override        = 2
num_steps_override         = 25
micro_batch_size_override  = 2
global_batch_size_override = 32
gate_window                = [11, 26]

[shared.gate]
gate_bitwise            = true
gate_atol               = 0
hash_capture_level      = 1
mfu_e2e_target          = 10.0
warmup_steps            = 10
loss_abs_threshold      = 0
grad_norm_abs_threshold = 0
forge_init_ones         = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
