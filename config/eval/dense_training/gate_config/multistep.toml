# multistep.toml — bitwise-multicard 单一源(DP=2 多步 bitwise;WS=2 / GBS=40)
# GBS 40(非 80):MBS 固定 2(涨到 4 会 OOM),grad_accum = 40/(2×2) = 10。
# 目的是把 grad_accum 从 20 砍到 10,让 ref+ours 两侧 8 步 bitwise(每 micro-batch
# 还要写 per-FQN hash,hash_capture_level=2,很重)都能在 timeout_s=1100 内跑完。
[shared]
world_size_override        = 2
num_steps_override         = 8
micro_batch_size_override  = 2
global_batch_size_override = 40
gate_window                = [1, 9]

[shared.gate]
gate_bitwise            = true
gate_atol               = 0
hash_capture_level      = 2
mfu_e2e_target          = 0
loss_abs_threshold      = 0
grad_norm_abs_threshold = 0
forge_init_ones         = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
