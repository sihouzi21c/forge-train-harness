# resume-startup-90.toml — 续训启动时间门禁单一源 (resume milestone, ours-only)
# 从 step 90 续训:dataloader 必须 O(1) cursor-restore seek(非 replay-by-discard)。
# 形状同 resume-gate-20(GBS80 / MBS4 / DP2 / grad_accum10)。判定阈值
# resume_startup_budget_s 不在此文件 —— 按设计 §5 放注册表 [evals.resume-startup-90]
# (冻结 eval.toml),dispatcher 从 eval.toml 读、不从产物读。此处只放执行输入。
[shared]
world_size_override        = 2
num_steps_override         = 100
micro_batch_size_override  = 4
global_batch_size_override = 80
resume_save_step           = 90
resume_post_steps          = 10

[shared.gate]
hash_capture_level = 0
forge_init_ones    = 0

[optim]
lr_warmup_iters_override = 0

[ours]
deterministic = true
