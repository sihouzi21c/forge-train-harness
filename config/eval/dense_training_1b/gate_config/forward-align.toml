# forward-align.toml — alignment.forward 单一源(harness 冻结侧渲染基)
[shared]
world_size_override        = 1
num_steps_override         = 1
micro_batch_size_override  = 2
global_batch_size_override = 2
gate_window                = [0, 1]

[shared.gate]
gate_bitwise       = true
gate_atol          = 0
hash_capture_level = 2
forge_init_ones    = 0

[optim]
lr_warmup_iters_override = 0

[ref]
deterministic = true

[ours]
deterministic = true
