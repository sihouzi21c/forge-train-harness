seed = 1234
gate_window = [101, 201]
resume_save_step = 0
deterministic = false
loss_rel_threshold = 0.025
forge_init_ones = 1
name = "minicpm5_1b"
num_layers = 24
hidden_size = 1536
ffn_hidden_size = 4608
num_attention_heads = 16
num_query_groups = 2
head_dim = 128
seq_length = 4096
max_position_embeddings = 4096
padded_vocab_size = 130560
rotary_base = 10000
norm_epsilon = 1e-06
init_method_std = 0.02
mup_base_hidden_size = 256
mup_emb_scale = 12.0
mup_depth_scale = 1.4
mtp_num_layers = 1
